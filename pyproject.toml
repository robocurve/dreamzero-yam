[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dreamzero-yam"
version = "0.1.0"
description = "Modal scaffolding for DreamZero post-training on MolmoAct2 BimanualYAM"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "modal>=1.0",
  "certifi>=2026.10.19",
  "aiohttp>=3.14.4",
  "numpy>=1.26,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
