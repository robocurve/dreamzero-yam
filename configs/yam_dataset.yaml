# @package _global_
# Standalone copy of upstream data/dreamzero/yam_relative.yaml with the
# 124-repository MolmoAct2 BimanualYAM training split substituted in.
# NOT chained via defaults: upstream's file only composes correctly when
# selected directly from the CLI (nested-default group context doubles
# its own 'dreamzero/base_...' reference). Regenerate by re-running the
# substitution over upstream if the pinned commit changes.

defaults:
  - dreamzero/base_48_wan_fine_aug_relative
  - _self_ # this file will override the base

max_state_dim: 64
use_global_metadata: false
relative_action: true
relative_action_per_horizon: false
relative_action_keys:
  - left_joint_pos
  - left_gripper_pos
  - right_joint_pos
  - right_gripper_pos
max_chunk_size: 5
# Use 10% of data in shards before moving to next shard
dataset_shard_sampling_rate: 0.1
mixture_dataset_cls: groot.vla.data.dataset.lerobot_sharded.ShardedLeRobotMixtureDataset.from_mixture_spec
single_dataset_cls: groot.vla.data.dataset.lerobot_sharded.ShardedLeRobotSubLangSingleActionChunkDatasetDROID

# Set your YAM dataset path here or override via CLI:
#   yam_data_root=/path/to/your/yam_dataset
yam_data_root: ???

train_dataset:
  _target_: ${mixture_dataset_cls}
  _convert_: object
  mixture_spec:
